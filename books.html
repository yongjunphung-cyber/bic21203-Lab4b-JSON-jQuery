<!DOCTYPE html>
<html>
<head>
    <title>Books Information</title>
</head>
<body>

    <h2>Books Information</h2>

    <div id="output"></div>

    <script>
        fetch("books.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Unable to load JSON file.");
                }
                return response.json();
            })
            .then(data => {

                const output = document.getElementById("output");

                const p1 = document.createElement("p");
                p1.textContent = "Title of first book: " + data.books[0].title;

                const p2 = document.createElement("p");
                p2.textContent = "Author of second book: " + data.books[1].author;

                const p3 = document.createElement("p");
                p3.textContent =
                    data.books[0].title + " - " +
                    data.books[0].genres.join(", ");

                const p4 = document.createElement("p");
                p4.textContent =
                    data.books[1].title + " - " +
                    data.books[1].genres.join(", ");

                output.appendChild(p1);
                output.appendChild(p2);
                output.appendChild(p3);
                output.appendChild(p4);
            })
            .catch(error => {
                document.getElementById("output").textContent =
                    "Error: " + error.message;
            });
    </script>

</body>
</html>
